<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#090a10"><link rel="icon" href="data:,"><title>Last Corridor — Sans Battle</title><style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090a10;color:#fff;font-family:'Press Start 2P',monospace;overscroll-behavior:none}body{display:flex;justify-content:center;align-items:center;min-height:100svh;padding:12px;background:radial-gradient(ellipse at 50% 15%,#20212c,#08090e);touch-action:manipulation}.shell{width:min(100%,1000px);display:flex;flex-direction:column;gap:12px}.topline{display:flex;justify-content:space-between;color:#92939d;font-size:9px;letter-spacing:1px}.brand{color:#f3f0e9}.brand b{color:#ffdf4a;font-weight:normal}.stage{position:relative;width:100%;aspect-ratio:16/9;min-height:220px;border:2px solid #393944;box-shadow:0 0 0 4px #11121a,0 18px 55px #000b;border-radius:4px;overflow:hidden;background:#050609}.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}.panel{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.status{display:flex;align-items:center;gap:15px;flex-wrap:wrap;font-size:11px}.hpgroup{display:flex;align-items:center;gap:8px}.bar{width:128px;height:13px;background:#5a1c24;border:1px solid #a34a49}.bar i{display:block;height:100%;width:100%;background:linear-gradient(#ffe44d,#efaa24);transition:width .25s}.hpnum{font-size:10px;color:#ddd}.actions{display:grid;grid-template-columns:repeat(4,minmax(78px,1fr));gap:10px}.action{font:12px 'Press Start 2P',monospace;background:#0d0e13;color:#ffdf4a;border:2px solid #ffdf4a;border-radius:4px;padding:13px 10px;cursor:pointer;min-height:48px;touch-action:manipulation}.action:nth-child(2){color:#5de7f2;border-color:#5de7f2}.action:nth-child(3){color:#ff6868;border-color:#ff6868}.action:nth-child(4){color:#68ef82;border-color:#68ef82}.action:hover:not(:disabled){background:#ffdf4a;color:#171717}.action:disabled{opacity:.42;cursor:default}.touch{display:none;align-items:center;justify-content:space-between;gap:12px}.pad{display:grid;grid-template:repeat(2,42px)/repeat(3,42px);gap:3px}.pad button,.focusbtn{border:1px solid #565763;background:#191a22;color:white;border-radius:6px;font-size:18px;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.touchlabel{color:#888;font:9px system-ui,sans-serif}.focusbtn{padding:0 18px;height:48px;font:10px 'Press Start 2P';color:#ffdf4a;border-color:#a89332}.hint{color:#858592;font:9px/1.5 system-ui,sans-serif;text-align:center}.intro{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#07080be8;z-index:2;padding:20px;transition:opacity .4s}.intro.hide{opacity:0;pointer-events:none}.intro-inner{max-width:520px}.intro h1{color:#ffdf4a;font-size:clamp(15px,3vw,26px);line-height:1.7}.intro p{font:14px/1.8 system-ui,sans-serif;color:#d1d0d5}.intro small{color:#888;font:10px/1.8 system-ui,sans-serif}.start{margin-top:16px;background:transparent;color:#ffdf4a;border:1px solid #ffdf4a;padding:13px 16px;font:10px 'Press Start 2P'}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#05060bdc;z-index:5;padding:20px}.overlay.show{display:flex}.card{width:min(440px,100%);border:2px solid #ffdf4a;background:#101118;padding:28px 24px;text-align:center}.card h1{font-size:19px;color:#ffdf4a}.card p{font:13px/1.8 system-ui,sans-serif;color:#d0cfda}.card .action{width:100%}
@media(max-width:620px){body{padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}.shell{gap:9px}.topline{font-size:8px}.stage{aspect-ratio:4/3;min-height:0}.panel{grid-template-columns:1fr;gap:10px}.status{gap:10px;font-size:9px}.bar{width:min(28vw,110px);height:11px}.hpnum{font-size:9px}.actions{gap:6px}.action{font-size:9px;padding:10px 4px;min-height:44px}.touch{display:flex}.pad{grid-template:repeat(2,36px)/repeat(3,36px)}.pad button{font-size:15px}.focusbtn{height:44px;padding:0 10px;font-size:8px}.hint{font-size:8px}}
</style></head><body><main class="shell"><div class="topline"><span class="brand">LAST <b>CORRIDOR</b></span><span>A FAN-MADE BATTLE</span></div><div class="stage"><canvas id="game" aria-label="Sans battle arena"></canvas><div class="intro" id="intro"><div class="intro-inner"><h1>THE LAST CORRIDOR</h1><p>One final stand.<br>One very lazy skeleton.</p><small>Move your SOUL. Survive the barrage.<br>Choose your moment to strike.</small><br><button class="start" id="start">[ BEGIN ]</button></div></div></div><div class="panel"><div class="status"><span>HUMAN</span><span style="color:#bbb">LV 1</span><div class="hpgroup">HP <span class="bar"><i id="hpbar"></i></span><span class="hpnum" id="hpnum">20 / 20</span></div></div><div class="hpnum" id="turnlabel">YOUR TURN</div></div><div class="actions"><button class="action" data-action="FIGHT">FIGHT</button><button class="action" data-action="ACT">ACT</button><button class="action" data-action="ITEM">ITEM</button><button class="action" data-action="MERCY">MERCY</button></div><div class="touch" id="touch"><div><div class="touchlabel">MOVE SOUL</div><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div></div><div style="text-align:right"><div class="touchlabel">HOLD TO FOCUS</div><button class="focusbtn" id="focus">FOCUS</button></div></div><div class="hint">Choose an action. Dodge with arrow keys, WASD, or the touch pad.</div></main><div class="overlay" id="modal"><div class="card"><h1 id="resulttitle">SPARED</h1><p id="resultcopy"></p><button class="action" id="again">FIGHT AGAIN</button></div></div><script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),hpbar=document.getElementById('hpbar'),hpnum=document.getElementById('hpnum'),turnlabel=document.getElementById('turnlabel');let W=960,H=540,state='intro',hp=20,bossHp=100,turn=0,frame=0,attackFrame=0,pattern=0,invuln=0,focus=false,held={},soul={x:0,y:0},bones=[],dialogue='',attackTimer=0,actCount=0,foodCount=1,flash=0;const arena={x:205,y:220,w:550,h:220};
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}window.addEventListener('resize',resize);resize();
function text(t,x,y,size=14,color='#fff',align='left'){ctx.font=`${size}px "Press Start 2P",monospace`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,x,y)}function box(x,y,w,h,fill,stroke=null,lw=2){ctx.fillStyle=fill;ctx.fillRect(x,y,w,h);if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.strokeRect(x,y,w,h)}}
function drawSans(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle='#252832';ctx.beginPath();ctx.ellipse(0,42,58,31,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#171a20';ctx.fillRect(-52,54,104,57);ctx.fillStyle='#f0eee7';ctx.beginPath();ctx.ellipse(0,0,43,39,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b9b8b2';ctx.fillRect(-38,24,76,8);ctx.fillRect(-28,31,56,5);ctx.fillStyle='#151820';ctx.beginPath();ctx.ellipse(-15,3,11,15,-.2,0,Math.PI*2);ctx.ellipse(16,3,11,15,.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4cecff';ctx.shadowColor='#36dfff';ctx.shadowBlur=15;ctx.fillRect(-19,0,8,4);ctx.shadowBlur=0;ctx.strokeStyle='#31333a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-17,22);ctx.quadraticCurveTo(0,28,17,21);ctx.stroke();for(let i=-12;i<=12;i+=8){ctx.fillStyle='#cac9c1';ctx.fillRect(i,22,4,4)}ctx.fillStyle='#222630';ctx.beginPath();ctx.moveTo(-41,45);ctx.lineTo(-53,100);ctx.quadraticCurveTo(0,120,53,100);ctx.lineTo(41,45);ctx.closePath();ctx.fill();ctx.fillStyle='#f2f1e9';ctx.beginPath();ctx.moveTo(-15,43);ctx.lineTo(0,66);ctx.lineTo(14,43);ctx.lineTo(19,104);ctx.lineTo(-20,104);ctx.closePath();ctx.fill();ctx.fillStyle='#e64e58';ctx.fillRect(-48,94,96,7);ctx.fillStyle='#eff0ed';ctx.fillRect(-58,97,16,12);ctx.fillRect(42,97,16,12);ctx.restore()}
function wrapText(t,x,y,max){ctx.font='16px "Press Start 2P",monospace';let line='',lines=[];for(const w of t.split(' ')){if(ctx.measureText(line+w+' ').width>max&&line){lines.push(line.trim());line=w+' '}else line+=w+' '}if(line)lines.push(line.trim());lines.slice(0,2).forEach((l,i)=>{ctx.fillStyle='#fff';ctx.fillText(l,x,y+i*30)})}
function drawDialogue(){box(90,292,780,150,'#050608','#e9e9e9',3);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='top';wrapText(dialogue,124,326,710);if(state==='player')text('▼',830,414,13,'#fff','center')}
function drawArena(){box(arena.x,arena.y,arena.w,arena.h,'#050609','#f4f4f4',4);ctx.save();ctx.beginPath();ctx.rect(arena.x+2,arena.y+2,arena.w-4,arena.h-4);ctx.clip();for(const b of bones){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.fillStyle=b.blue?'#63dcff':'#f5f4ec';ctx.shadowColor=b.blue?'#51dfff':'#fff';ctx.shadowBlur=b.blue?11:0;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);if(b.h>b.w){ctx.fillRect(-b.w,-b.h/2-3,b.w*2,8);ctx.fillRect(-b.w,b.h/2-5,b.w*2,8)}ctx.restore()}if(state==='attack'){ctx.fillStyle='#ff303a';ctx.shadowColor='#ff3344';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(soul.x,soul.y-10);ctx.lineTo(soul.x+10,soul.y);ctx.lineTo(soul.x,soul.y+10);ctx.lineTo(soul.x-10,soul.y);ctx.fill();ctx.shadowBlur=0}ctx.restore();text('DODGE!',480,458,10,'#777','center')}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#11131c');g.addColorStop(1,'#08090e');box(0,0,W,H,g);for(let i=0;i<7;i++){ctx.strokeStyle=`rgba(136,139,160,${.06-i*.005})`;ctx.beginPath();ctx.moveTo(480+(i-3)*64,0);ctx.lineTo(480+(i-3)*130,215);ctx.stroke()}for(let i=0;i<36;i++){ctx.fillStyle=i%3?'#747889':'#f0df9e';ctx.globalAlpha=.15+Math.sin(frame*.03+i)*.08;ctx.fillRect((i*173+frame*.12)%960,(i*71)%198,2,2)}ctx.globalAlpha=1;drawSans(480,104);text('SANS',480,190,10,'#bfc1cb','center');if(state==='attack')drawArena();else if(state!=='intro')drawDialogue();if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.18})`;ctx.fillRect(0,0,W,H);flash*=.85}frame++;requestAnimationFrame(draw)}
function setHP(){hpbar.style.width=`${hp/20*100}%`;hpnum.textContent=`${hp} / 20`}function updateControls(){document.querySelectorAll('[data-action]').forEach(b=>b.disabled=state!=='player');document.getElementById('touch').style.opacity=state==='attack'?'1':'.48';turnlabel.textContent=state==='attack'?'DODGE!':state==='player'?'YOUR TURN':state==='won'?'BATTLE WON':'SANS\' TURN'}function setDialogue(s){dialogue=s}
function begin(){if(state!=='intro')return;document.getElementById('intro').classList.add('hide');state='player';setDialogue('* sans blocks the way. he looks bored.');updateControls()}document.getElementById('start').onclick=begin;
function showResult(win){document.getElementById('resulttitle').textContent=win?'SPARED':'GAME OVER';document.getElementById('resultcopy').textContent=win?'The corridor is quiet again. Somehow, Sans still looks pretty relaxed.':'The corridor fades to black. Take a breath and try again.';setTimeout(()=>document.getElementById('modal').classList.add('show'),650)}
function act(a){if(state!=='player')return;if(a==='FIGHT'){bossHp-=26;flash=1;if(bossHp<=0){bossHp=0;state='won';setDialogue('* sans falls to one knee. “heh. guess you win.”');showResult(true);updateControls();return}setDialogue('* You swing at Sans. He dodges with a lazy step.')}if(a==='ACT'){actCount++;setDialogue(['* You tell a joke. Sans lets out a tiny snort.','* You offer to share your lunch. Sans considers it.','* Sans says, “you’re really going for it, huh?”'][Math.min(actCount-1,2)])}if(a==='ITEM'){if(!foodCount){setDialogue('* Your pockets are empty.');return}foodCount--;hp=Math.min(20,hp+8);setHP();setDialogue('* You ate a cinnamon star. HP restored.')}if(a==='MERCY'){if(actCount>=2){state='won';setDialogue('* Sans steps aside. “that’s enough. you can go.”');showResult(true);updateControls();return}setDialogue('* Sans shrugs. “not quite done yet, kid.”')}turn++;startAttack()}document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));
function startAttack(){state='attack';attackFrame=0;pattern=(turn-1)%3;bones=[];soul={x:arena.x+arena.w/2,y:arena.y+arena.h/2};invuln=0;attackTimer=pattern===2?570:480;setDialogue('* sans is getting serious.');updateControls()}function move(dx,dy){if(state!=='attack')return;const speed=focus?2.1:4.4;soul.x=Math.max(arena.x+15,Math.min(arena.x+arena.w-15,soul.x+dx*speed));soul.y=Math.max(arena.y+15,Math.min(arena.y+arena.h-15,soul.y+dy*speed))}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();held[k]=true;if(k==='shift')focus=true;if(k==='enter'&&state==='intro')begin();else if(k==='enter'&&state==='player')act('FIGHT')});window.addEventListener('keyup',e=>{held[e.key.toLowerCase()]=false;if(e.key==='Shift')focus=false});document.querySelectorAll('[data-dir]').forEach(b=>{const keys={up:'arrowup',down:'arrowdown',left:'arrowleft',right:'arrowright'},key=keys[b.dataset.dir];b.addEventListener('pointerdown',e=>{e.preventDefault();held[key]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>held[key]=false))});const focusButton=document.getElementById('focus');focusButton.onpointerdown=e=>{e.preventDefault();focus=true};['pointerup','pointercancel','pointerleave'].forEach(ev=>focusButton.addEventListener(ev,()=>focus=false));
document.getElementById('again').onclick=()=>{document.getElementById('modal').classList.remove('show');state='intro';document.getElementById('intro').classList.remove('hide');hp=20;bossHp=100;turn=0;actCount=0;foodCount=1;bones=[];setHP();updateControls()};
function spawnBone(x,y,vx,vy,w=14,h=70,blue=false){bones.push({x,y,vx,vy,w,h,blue,angle:Math.atan2(vy,vx)})}function updateAttack(){attackFrame++;if(held.arrowup||held.w)move(0,-1);if(held.arrowdown||held.s)move(0,1);if(held.arrowleft||held.a)move(-1,0);if(held.arrowright||held.d)move(1,0);if(invuln)invuln--;const t=attackFrame,ax=arena.x,ay=arena.y,aw=arena.w,ah=arena.h;
if(pattern===0){if(t%46===1){const side=Math.floor(t/46)%2===0?-1:1,y=ay+28+Math.random()*(ah-56);spawnBone(side<0?ax-25:ax+aw+25,y,side<0?5.2:-5.2,0,20,76)}if(t%95===28)spawnBone(ax+35+Math.random()*(aw-70),ay-30,0,4.2,12,54)}else if(pattern===1){if(t%28===1){const x=ax+24+Math.random()*(aw-48);spawnBone(x,ay-45,0,4.8,14,65,Math.floor(t/28)%3===1)}if(t%80===1){const left=t%160===1;spawnBone(left?ax-20:ax+aw+20,ay+ah*.55,left?4.8:-4.8,0,18,80)}}else{if(t%60===1){const y=ay+42+Math.random()*(ah-84),left=Math.floor(t/60)%2===0;spawnBone(left?ax-35:ax+aw+35,y,left?5.5:-5.5,0,18,90,t%120===1)}if(t%92===24)for(let i=0;i<5;i++)if(i!==2)spawnBone(ax+aw*.28+i*28,ay-18,0,4.5,12,62)}
for(let i=bones.length-1;i>=0;i--){const b=bones[i];b.x+=b.vx;b.y+=b.vy;if(b.x<ax-100||b.x>ax+aw+100||b.y>ay+ah+100){bones.splice(i,1);continue}if(!invuln&&Math.abs(b.x-soul.x)<b.w/2+8&&Math.abs(b.y-soul.y)<b.h/2+8){hp=Math.max(0,hp-1);setHP();invuln=43;flash=.7;if(!hp){state='lost';setDialogue('* your determination is fading…');showResult(false);updateControls()}}}if(--attackTimer<=0){state='player';bones=[];setDialogue('* sans yawns. your turn.');updateControls()}}
function loop(){if(state==='attack')updateAttack();requestAnimationFrame(loop)}requestAnimationFrame(draw);requestAnimationFrame(loop);setHP();updateControls()
})();
</script></body></html>
